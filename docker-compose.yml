version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key
      - DATABASE_URL=sqlite:///users.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  # Frontend Development Service (for development)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - app-network
    depends_on:
      - backend
    profiles:
      - dev

  # Database Service (for production)
  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=checklist_tool
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    profiles:
      - prod

  # Redis Service (for caching and sessions)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    profiles:
      - prod

  # Nginx Service (for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - app-network
    depends_on:
      - backend
    profiles:
      - prod

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge 